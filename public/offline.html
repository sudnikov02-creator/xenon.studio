<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>xenon.studio — нет соединения</title>
    <meta name="theme-color" content="#2563eb" />
    <style>
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid;
        place-items: center;
        background: radial-gradient(120% 90% at 20% 0%, #eef4ff 0%, #f6f8fc 45%, #ffffff 100%);
        color: #0b1220;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        padding: 24px;
      }
      .card {
        width: min(440px, 100%);
        background: #fff;
        border: 1px solid #e8edf5;
        border-radius: 24px;
        padding: 36px 32px;
        text-align: center;
        box-shadow: 0 30px 80px -40px rgba(16, 35, 70, 0.35);
      }
      .mark {
        width: 56px; height: 56px; border-radius: 16px; margin: 0 auto 22px;
        background: linear-gradient(135deg, #3b82f6, #1d4ed8);
        display: grid; place-items: center;
        box-shadow: 0 14px 30px -12px rgba(37, 99, 235, 0.7);
      }
      h1 { font-size: 21px; margin: 0 0 10px; letter-spacing: -0.02em; }
      p { color: #64748b; font-size: 14px; line-height: 1.6; margin: 0 0 24px; }
      button {
        appearance: none; border: 0; cursor: pointer;
        background: #2563eb; color: #fff; font-weight: 600; font-size: 14px;
        padding: 12px 22px; border-radius: 12px; font-family: inherit;
        transition: transform 0.2s ease, background 0.2s ease;
      }
      button:hover { background: #1d4ed8; }
      button:active { transform: scale(0.97); }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark">
        <svg width="30" height="30" viewBox="0 0 64 64" fill="none">
          <circle cx="32" cy="32" r="15.5" stroke="#fff" stroke-width="2.4" />
          <path d="M32 22.2 40.5 27v9.6L32 41.4 23.5 36.6V27z" stroke="#fff" stroke-width="2" stroke-linejoin="round" />
          <circle cx="32" cy="32" r="2" fill="#fff" />
        </svg>
      </div>
      <h1>Нет подключения к сети</h1>
      <p>Похоже, интернет пропал. Проверьте соединение — данные загрузятся автоматически, как только сеть вернётся.</p>
      <button onclick="location.reload()">Повторить попытку</button>
    </div>
  </body>
</html>
